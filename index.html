<style>
 :root{
 --primary:#FF385C;
 --primary-dark:#D70466;
 --primary-soft:#FFF0F3;
 --secondary:#00A699;
 --secondary-dark:#008489;
 --secondary-soft:#E0F7F5;
 --surface:#FFFFFF;
 --bg:#F7F7F7;
 --ink:#222222;
 --ink-secondary:#717171;
 --border:#DDDDDD;
 --border-light:#EBEBEB;
 --shadow: 0 6px 20px rgba(0,0,0,0.08);
 --shadow-hover: 0 6px 20px rgba(0,0,0,0.14);
 --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
 --radius: 16px;
 --radius-sm: 12px;
 --radius-pill: 100px;
 --transition: 0.2s cubic-bezier(0.2,0,0,1);
 }
 .mi{
 font-family:'Material Symbols Rounded';
 font-variation-settings:'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
 vertical-align:middle;
 font-size:20px;
 }
 .mi-sm{font-size:18px;}
 .mi-lg{font-size:24px;}
 .mi-outline{font-variation-settings:'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;}

 *{box-sizing:border-box;}
 html{overflow-x:hidden;width:100%;scroll-behavior:smooth;}
 body{
 margin:0;
 background:var(--bg);
 color:var(--ink);
 font-family:'Inter','Noto Sans Thai',-apple-system,'Segoe UI',sans-serif;
 -webkit-font-smoothing:antialiased;
 width:100%;
 }
 :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px;}
 ::selection{background:var(--primary-soft);color:var(--primary-dark);}
 .wrap{max-width:1160px;margin:0 auto;padding:0 20px 70px;}
 h1,h2,h3,h4{font-family:'Inter','Noto Sans Thai',-apple-system,'Segoe UI',sans-serif;font-weight:700;letter-spacing:-0.01em;}

 header.hero{
 position:relative;
 overflow:hidden;
 padding:56px 20px 76px;
 text-align:center;
 background:
 radial-gradient(75% 60% at 12% 0%, var(--secondary-soft) 0%, transparent 55%),
 radial-gradient(120% 100% at 50% 0%, var(--primary-soft) 0%, var(--bg) 62%);
 }
 .hero-skyline{
 position:absolute;left:0;right:0;bottom:0;
 width:100%;height:100px;
 fill:var(--primary);
 opacity:0.09;
 pointer-events:none;
 }
 .hero-inner{position:relative;z-index:1;animation:heroIn .5s cubic-bezier(0.2,0,0,1);}
 @keyframes heroIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
 .eyebrow{
 display:inline-flex;align-items:center;gap:6px;
 background:var(--surface);
 padding:7px 18px;
 border-radius:30px;
 font-size:12.5px;
 letter-spacing:0.04em;
 color:var(--primary-dark);
 font-weight:700;
 box-shadow:var(--shadow-sm);
 margin-bottom:14px;
 }
 h1.title{
 font-weight:700;
 font-size:clamp(34px,6vw,52px);
 margin:0 0 10px;
 color:var(--ink);
 letter-spacing:-0.02em;
 }
 .hero-sub{
 margin:0;
 font-size:15px;
 color:var(--ink-secondary);
 font-weight:500;
 }
 .hero-countdown{
 display:inline-flex;align-items:center;gap:6px;
 margin-top:16px;
 background:var(--surface);
 padding:7px 18px;
 border-radius:20px;
 font-size:12.5px;font-weight:700;
 color:var(--secondary-dark);
 box-shadow:var(--shadow-sm);
 animation:countdownPulse 2.6s ease-in-out infinite;
 }
 @keyframes countdownPulse{0%,100%{box-shadow:var(--shadow-sm);}50%{box-shadow:0 6px 18px rgba(0,166,153,0.28);}}

 .day-rail{
 display:grid;
 grid-template-columns:repeat(5, 1fr);
 gap:12px;
 padding:6px 4px 12px;
 margin-top:-6px;
 position:sticky;
 top:0;
 z-index:1500;
 background:var(--bg);
 transition:box-shadow .15s ease;
 }
 .day-rail.is-stuck{
 box-shadow:var(--shadow-sm);
 border-radius:0 0 20px 20px;
 }
 .day-rail.is-stuck .day-pill{padding-bottom:10px;}
 .day-rail.is-stuck .day-pill .route{display:none;}
 .day-pill{
 background:var(--surface);
 border-radius:24px;
 box-shadow:var(--shadow);
 padding:14px 16px;
 cursor:pointer;
 border:2.5px solid transparent;
 transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
 min-width:0;
 }
 .day-pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
 .day-pill:active{transform:translateY(0);}
 .day-pill.active{border-color:var(--primary); background:var(--primary-soft);box-shadow:var(--shadow-hover);}
 .day-pill .pill-top{
 display:flex; align-items:center; margin-bottom:6px;
 }
 .day-pill .num{
 background:var(--border);
 color:var(--ink-secondary);
 font-weight:700;
 width:auto;height:26px;padding:0 12px;border-radius:14px;
 display:flex;align-items:center;justify-content:center;
 font-size:11.5px;
 white-space:nowrap;
 transition:background .15s ease, color .15s ease;
 }
 .day-pill.active .num{
 background:var(--primary-dark);
 color:#fff;
 font-weight:800;letter-spacing:0.02em;
 }
 .pill-date-row{margin-bottom:8px;}
 .pill-date-main{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;}
 .pill-date-weekday{font-size:12.5px;font-weight:600;color:var(--ink-secondary);margin-left:6px;}
 .day-pill .route{font-size:12.5px;color:var(--ink);line-height:1.5;overflow-wrap:break-word;}
 .day-pill.placeholder{
 display:flex;align-items:center;justify-content:center;
 text-align:center;color:var(--ink-secondary);
 border:2px dashed var(--border);
 box-shadow:none;background:transparent;
 font-size:12.5px;
 }

 #dayContent{
 transition:opacity .18s ease, transform .18s ease;
 }
 #dayContent.day-fade{opacity:0;transform:translateY(6px);}

 .section-title{
 display:flex;align-items:center;gap:10px;
 margin:34px 0 16px;
 }
 .section-title h2{
 font-size:24px;margin:0;color:var(--ink);
 }
 .section-title .date-chip{
 font-size:12.5px;font-weight:700;color:var(--primary-dark);
 background:var(--primary-soft);
 padding:4px 12px;border-radius:20px;
 }
 .weather-chip{
 display:inline-flex;align-items:center;gap:6px;
 background:var(--secondary-soft);color:var(--secondary-dark);
 font-size:12.5px;font-weight:700;
 padding:6px 14px;border-radius:20px;
 white-space:nowrap;
 }
 .weather-chip:empty{display:none;}
 .weather-chip .mi{font-size:18px;}
 .weather-chip-note{font-weight:600;color:var(--ink-secondary);font-size:10.5px;margin-left:1px;}

 .grid{
 display:grid;
 grid-template-columns:0.95fr 1.05fr;
 gap:22px;
 align-items:start;
 }
 @media (max-width:860px){ .grid{grid-template-columns:1fr;} }

 .card{
 background:var(--surface);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 border:1px solid var(--border-light);
 max-width:100%;
 overflow:hidden;
 position:relative;
 animation:cardIn .4s cubic-bezier(0.2,0,0,1);
 }
 @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

 /* Spotlight hover: a soft glow that follows the cursor, desktop only */
 .timeline-card::before,
 .map-card::before{
 content:"";
 position:absolute;inset:0;
 z-index:-1;
 background:radial-gradient(420px circle at var(--spot-x, 50%) var(--spot-y, 50%), var(--primary-soft), transparent 65%);
 opacity:0;
 transition:opacity .3s ease;
 pointer-events:none;
 }
 @media (hover:hover){
 .timeline-card:hover::before,
 .map-card:hover::before{opacity:1;}
 }

 .timeline-card{padding:8px 4px 18px;}
 .card-head{
 display:flex;align-items:center;gap:8px;
 padding:16px 22px 8px;
 font-weight:700;color:var(--ink);font-size:14.5px;
 }
 .tl-list{padding:0 14px;display:flex;flex-direction:column;gap:10px;}
 .tl-item{
 display:flex;gap:16px;
 background:var(--bg);
 border-radius:18px;
 padding:14px 16px;
 transition:background .15s ease, box-shadow .15s ease;
 animation:tlItemIn .35s cubic-bezier(0.2,0,0,1) backwards;
 }
 .tl-item:hover{box-shadow:0 0 0 1.5px var(--border) inset;}
 @keyframes tlItemIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
 .tl-item.tl-stop{
 background:var(--secondary-soft);
 }
 .tl-time-col{flex:0 0 74px;}
 .tl-time{
 font-weight:700;color:var(--ink);
 font-size:13px;line-height:1.3;
 }
 .tl-dur{
 display:block;
 font-weight:600;
 font-size:10.5px;
 color:var(--ink-secondary);
 margin-top:2px;
 }
 .tl-main{flex:1;min-width:0;}
 .tl-activity{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:8px;overflow-wrap:break-word;word-break:break-word;}
 .tl-activity a{overflow-wrap:break-word;word-break:break-word;}
 .tl-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
 .tl-transport{
 display:inline-flex;align-items:center;gap:5px;
 font-size:12px;color:var(--secondary-dark);font-weight:600;
 overflow-wrap:anywhere;
 max-width:100%;
 }
 .tl-loc-link{
 text-decoration:none;
 display:inline-flex;align-items:center;gap:3px;
 max-width:220px;
 overflow:hidden;
 font-size:11.5px;color:var(--primary-dark);font-weight:700;
 background:var(--primary-soft);
 padding:4px 10px;border-radius:20px;
 white-space:nowrap;
 text-overflow:ellipsis;
 transition:transform .12s ease;
 }
 .tl-loc-link .loc-text{overflow:hidden;text-overflow:ellipsis;}
 .tl-loc-link:hover{transform:translateY(-1px);text-decoration:underline;}
 @media (max-width:480px){
 .tl-item{flex-direction:column;gap:8px;}
 .tl-time-col{flex:none;display:flex;align-items:baseline;gap:8px;}
 .tl-dur{margin-top:0;}
 }

 .sched-btn{
 display:inline-flex;align-items:center;gap:5px;
 font-family:'Inter','Noto Sans Thai',-apple-system,'Segoe UI',sans-serif;
 font-size:12px;font-weight:700;
 color:var(--secondary-dark);
 background:var(--surface);
 border:1.5px solid var(--secondary-dark);
 padding:4px 10px;border-radius:20px;
 cursor:pointer;
 overflow-wrap:anywhere;
 max-width:100%;
 }
 .sched-btn:hover{background:var(--secondary-soft);}
 .sched-btn .caret{transition:transform .15s ease;font-size:10px;}
 .sched-btn.open .caret{transform:rotate(180deg);}
 .sched-detail{
 background:var(--secondary-soft);
 border-radius:16px;
 padding:12px 16px;
 font-size:12.5px;
 color:var(--ink);
 line-height:1.6;
 margin-top:10px;
 }
 .sched-detail .sd-row{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;}
 .sched-detail .sd-take{color:var(--primary-dark);font-weight:700;}
 .sched-detail .sd-next{color:var(--secondary-dark);font-weight:700;}
 .sched-detail a{
 color:var(--ink);font-weight:700;text-decoration:underline;
 text-underline-offset:2px;
 }

 /* ---------- Info dropdown (read more) ---------- */
 .info-btn{
 display:inline-flex;align-items:center;gap:5px;
 font-family:inherit;
 font-size:12px;font-weight:700;
 color:var(--primary);
 background:var(--surface);
 border:1.5px solid var(--primary);
 padding:4px 10px;border-radius:20px;
 cursor:pointer;
 overflow-wrap:anywhere;
 max-width:100%;
 }
 .info-btn:hover{background:var(--primary-soft);}
 .info-btn .caret{transition:transform .15s ease;font-size:10px;}
 .info-btn.open .caret{transform:rotate(180deg);}
 .info-detail{
 background:var(--primary-soft);
 border-radius:16px;
 padding:14px 16px;
 font-size:12.5px;
 color:var(--ink);
 line-height:1.7;
 margin-top:10px;
 }
 .info-detail h5{margin:0 0 6px;font-size:13px;color:var(--primary-dark);}
 .info-detail ul{margin:0 0 10px;padding-left:18px;}
 .info-detail ul:last-child{margin-bottom:0;}
 .info-detail a{color:var(--primary-dark);font-weight:700;text-decoration:underline;text-underline-offset:2px;}

 /* ---------- Daily notes ---------- */
 .notes-card{margin-top:22px;padding:20px 22px;}

 /* ---------- Expense tracker ---------- */
 .expense-form{
 display:flex;flex-direction:column;gap:14px;
 padding:0 0 16px;
 }
 .field-group{display:flex;flex-direction:column;gap:6px;}
 .field-label{
 font-size:11.5px;font-weight:700;color:var(--ink-secondary);
 text-transform:uppercase;letter-spacing:0.05em;
 }
 .expense-form input{
 font-family:inherit;font-size:13.5px;
 padding:10px 14px;border-radius:16px;
 border:1.5px solid var(--border);
 background:var(--surface);color:var(--ink);
 outline:none;width:100%;
 }
 .expense-form input:focus{border-color:var(--primary);}
 .amount-row{display:flex;gap:8px;align-items:stretch;}
 .amount-row #expAmount{flex:1;min-width:0;font-size:18px;font-weight:700;}
 .expense-rate-note{font-size:10.5px;color:var(--ink-secondary);min-height:13px;}

 /* Segmented control: Payer Name, Payment Method */
 .segmented{display:flex;background:var(--bg);border-radius:16px;padding:3px;gap:2px;}
 .segmented-opt{
 flex:1;
 display:flex;align-items:center;justify-content:center;gap:5px;
 font-family:inherit;font-size:12.5px;font-weight:700;
 color:var(--ink-secondary);
 background:none;border:none;border-radius:13px;
 padding:9px 8px;cursor:pointer;
 transition:background .15s ease, color .15s ease, box-shadow .15s ease;
 white-space:nowrap;
 }
 .segmented-opt .mi{font-size:16px;}
 .segmented-opt:hover{color:var(--ink);}
 .segmented-opt.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}

 /* Currency toggle: NT$ / THB */
 .currency-toggle{flex:0 0 auto;display:flex;background:var(--bg);border-radius:16px;padding:3px;gap:2px;}
 .currency-opt{
 font-family:inherit;font-size:12.5px;font-weight:700;
 color:var(--ink-secondary);
 background:none;border:none;border-radius:13px;
 padding:0 12px;cursor:pointer;
 transition:background .15s ease, color .15s ease, box-shadow .15s ease;
 }
 .currency-opt:hover{color:var(--ink);}
 .currency-opt.active{background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);}

 .expense-submit-btn{
 font-family:inherit;font-size:14px;font-weight:700;
 color:#fff;background:var(--primary);
 border:none;border-radius:16px;
 padding:13px 14px;cursor:pointer;
 transition:transform .12s ease, background .15s ease;
 }
 .expense-submit-btn:hover{transform:translateY(-1px);background:var(--primary-dark);}
 .expense-submit-btn:active{transform:translateY(0) scale(0.98);}

 .expense-status{
 display:flex;align-items:center;gap:6px;
 font-size:12.5px;font-weight:700;
 border-radius:12px;
 transition:all .2s ease;
 }
 .expense-status:empty{padding:0;}
 .expense-status.is-ok{color:var(--secondary-dark);background:var(--secondary-soft);padding:10px 14px;}
 .expense-status.is-error{color:var(--primary-dark);background:var(--primary-soft);padding:10px 14px;}

 .expense-list{padding:0;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
 .undo-toast{
 position:relative;overflow:hidden;
 display:flex;align-items:center;gap:10px;
 background:var(--ink);color:#fff;
 border-radius:16px;padding:12px 14px;
 margin-bottom:10px;
 animation:undoToastIn .2s cubic-bezier(0.2,0,0,1);
 }
 @keyframes undoToastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
 .undo-toast-text{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow-wrap:break-word;}
 .undo-toast-btn{
 flex:0 0 auto;
 background:none;border:none;color:var(--secondary);
 font-family:inherit;font-weight:800;font-size:12.5px;
 text-transform:uppercase;letter-spacing:0.03em;
 cursor:pointer;padding:4px 6px;
 }
 .undo-toast-btn:hover{text-decoration:underline;}
 .undo-toast-bar{
 position:absolute;left:0;bottom:0;height:3px;
 background:var(--primary);
 animation:undoToastShrink 3s linear forwards;
 }
 @keyframes undoToastShrink{from{width:100%;}to{width:0%;}}
 .expense-empty{
 font-size:12.5px;color:var(--ink-secondary);
 background:var(--bg);
 border-radius:16px;padding:14px;text-align:center;
 }
 .expense-row{
 display:flex;align-items:center;gap:10px;
 background:var(--bg);
 border-radius:16px;padding:10px 14px;
 }
 @keyframes expenseRowIn{
 0%{background:var(--secondary-soft);transform:scale(0.98);}
 100%{background:var(--bg);transform:scale(1);}
 }
 .expense-row-new{animation:expenseRowIn .7s ease;}
 .expense-row-main{flex:1;min-width:0;display:flex;flex-direction:column;}
 .expense-name{font-weight:700;font-size:12.5px;color:var(--ink);}
 .expense-desc{font-size:11.5px;color:var(--ink-secondary);}
 .expense-amount{font-weight:700;font-size:13px;color:var(--primary-dark);white-space:nowrap;}
 .expense-del{
 background:none;border:none;color:var(--ink-secondary);
 font-size:14px;cursor:pointer;padding:2px 4px;
 border-radius:16px;
 }
 .expense-del:hover{background:var(--primary-soft);color:var(--primary-dark);}
 .summary-del{
 background:none;border:none;color:var(--ink-secondary);
 font-size:13px;cursor:pointer;padding:2px 6px;
 border-radius:16px;margin-left:6px;
 }
 .summary-del:hover{background:var(--primary-soft);color:var(--primary-dark);}
 .expense-summary{padding:6px 0 4px;}
 .summary-total{
 font-size:13px;font-weight:700;color:var(--ink);
 margin-bottom:10px;
 background:var(--secondary-soft);
 border-radius:16px;padding:12px 14px;
 }
 .summary-row{
 display:flex;align-items:center;gap:10px;flex-wrap:wrap;
 padding:8px 4px;border-top:1px solid var(--border-light);
 font-size:12.5px;
 }
 .summary-name{font-weight:700;color:var(--ink);min-width:70px;}
 .summary-paid{color:var(--ink-secondary);}
 .bal-plus{margin-left:auto;color:var(--secondary-dark);font-weight:700;}
 .bal-minus{margin-left:auto;color:var(--primary-dark);font-weight:700;}
 .expense-actions{
 padding:14px 0 4px;
 display:flex;align-items:center;gap:10px;flex-wrap:wrap;
 }
 .expense-disabled-note{
 margin:0 0 4px;padding:14px;
 background:var(--primary-soft);color:var(--primary-dark);
 border-radius:16px;font-size:12.5px;line-height:1.6;
 }

 .expense-row .exp-name{font-weight:700;color:var(--primary-dark);flex:0 0 50px;}
 .expense-row .exp-item{flex:1;color:var(--ink);}
 .expense-row .exp-amount{font-weight:700;color:var(--primary-dark);white-space:nowrap;}
 .exp-rate-flag{flex:0 0 auto;color:var(--secondary-dark);font-size:15px;cursor:help;}
 .expense-row .exp-payment{font-size:11px;color:var(--ink-secondary);flex:0 0 auto;}
 .expense-row .exp-del{
 background:none;border:none;color:var(--ink-secondary);cursor:pointer;font-size:15px;flex:0 0 auto;
 }
 .expense-day-total{
 text-align:right;font-weight:700;font-size:14px;color:var(--ink);
 padding-top:8px;border-top:1.5px dashed var(--border);
 }

 /* ---------- Report modal ---------- */
 .report-overlay{
 position:fixed;inset:0;
 background:rgba(0,0,0,0.5);
 backdrop-filter:blur(4px);
 z-index:2000;
 display:flex;align-items:center;justify-content:center;
 padding:20px;
 }
 .report-modal{
 background:var(--surface);
 border-radius:var(--radius);
 border:1px solid var(--border-light);
 max-width:480px;width:100%;
 max-height:85vh;
 overflow-y:auto;
 box-shadow:var(--shadow);
 }
 .report-modal-head{
 display:flex;align-items:center;justify-content:space-between;
 padding:18px 20px;
 border-bottom:1.5px solid var(--border-light);
 position:sticky;top:0;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;
 }
 .report-modal-head h3{margin:0;font-size:17px;color:var(--ink);display:flex;align-items:center;gap:8px;}
 .report-close{
 background:var(--bg);border:none;border-radius:50%;
 width:30px;height:30px;font-size:14px;cursor:pointer;color:var(--ink);
 display:flex;align-items:center;justify-content:center;
 }
 .report-body{padding:18px 20px 22px;}
 .report-day-tabs{
 display:flex;flex-wrap:wrap;gap:6px;
 margin-bottom:12px;
 }
 .report-day-tab{
 font-family:inherit;font-size:12px;font-weight:700;
 padding:6px 12px;border-radius:16px;
 border:1.5px solid var(--border);
 background:var(--surface);color:var(--ink);
 cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:1px;
 }
 .report-day-tab-date{font-size:9px;font-weight:600;color:var(--ink-secondary);}
 .report-day-tab.active .report-day-tab-date{color:rgba(255,255,255,0.75);}
 .report-day-tab.active{
 background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;
 }

 .view-summary-mini-btn{
 display:flex;align-items:center;justify-content:center;gap:6px;
 margin:14px auto 2px;
 background:none;border:1.5px solid var(--border);
 color:var(--ink-secondary);font-weight:700;font-size:12.5px;
 padding:8px 16px;border-radius:20px;cursor:pointer;
 font-family:inherit;
 transition:border-color .15s ease, color .15s ease;
 }
 .view-summary-mini-btn:hover{border-color:var(--primary);color:var(--primary-dark);}

 .export-excel-btn{
 display:block;width:100%;
 margin-top:18px;
 background:var(--secondary-dark);
 color:#fff;font-weight:700;font-size:14px;
 border:none;padding:13px;border-radius:var(--radius-sm);cursor:pointer;
 font-family:inherit;
 box-shadow:var(--shadow-sm);
 }
 /* ---------- Summary dashboard: hero stat + bento tiles ---------- */
 .stat-hero{
 background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
 color:#fff;
 border-radius:18px;
 padding:20px 22px;
 margin-bottom:16px;
 box-shadow:var(--shadow);
 }
 .stat-hero-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;opacity:0.85;}
 .stat-hero-value{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
 .stat-hero-sub{font-size:12px;opacity:0.85;}
 .stat-hero-split{
 margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.25);
 display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;
 }
 .stat-hero-split b{font-size:14px;}

 .stat-section-label{
 font-size:11px;font-weight:700;color:var(--ink-secondary);
 text-transform:uppercase;letter-spacing:0.05em;
 margin:0 0 8px;
 }

 .stat-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:18px;}
 @media (max-width:480px){ .stat-grid{grid-template-columns:1fr;} }
 .stat-tile{background:var(--bg);border-radius:16px;padding:14px;}
 .stat-tile-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
 .stat-tile-avatar{
 width:24px;height:24px;border-radius:50%;flex:0 0 auto;
 background:var(--primary-soft);color:var(--primary-dark);
 display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:800;
 }
 .stat-tile-name{font-weight:700;font-size:13px;color:var(--ink);}
 .stat-tile-value{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;}
 .stat-tile-value.is-get{color:var(--secondary-dark);}
 .stat-tile-value.is-owe{color:var(--primary-dark);}
 .stat-tile-paid{font-size:11px;color:var(--ink-secondary);margin-top:2px;}
 .stat-tile-bar-track{height:5px;border-radius:3px;background:var(--border-light);overflow:hidden;margin-top:8px;}
 .stat-tile-bar{height:100%;border-radius:3px;}
 .stat-tile-bar.bar-get{background:var(--secondary);}
 .stat-tile-bar.bar-owe{background:var(--primary);}

 .report-daybreakdown{
 background:var(--bg);border-radius:14px;padding:6px 14px;margin-bottom:4px;
 }
 .report-day-date{color:var(--ink-secondary);font-weight:400;font-size:11.5px;}

 .expense-status{
 grid-column:1 / -1;
 font-size:12.5px;font-weight:700;
 min-height:16px;
 }
 .expense-status.is-ok{color:var(--secondary-dark);}
 .expense-status.is-error{color:var(--primary-dark);}
 .expense-error{
 background:var(--primary-soft);color:var(--primary-dark);
 border-radius:12px;padding:10px 14px;font-size:12.5px;
 margin-bottom:10px;
 }
 .fallback-note{
 margin-top:12px;
 background:#FFF8E1;color:#8A6D1D;
 border-radius:12px;padding:10px 14px;font-size:11.5px;line-height:1.5;
 }

 .today-summary{
 margin-top:14px;background:var(--secondary-soft);border-radius:14px;padding:12px 16px;
 }
 .today-summary-title{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:6px;}
 .today-summary-total{font-weight:700;font-size:14px;color:var(--primary-dark);margin-bottom:6px;}
 .today-summary-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink);padding:2px 0;}

 .report-day-subline{font-size:11px;color:var(--ink-secondary);padding:0 0 8px 24px;}

 .settlement-box{
 margin-top:18px;background:var(--secondary-soft);border-radius:14px;padding:14px 16px;
 }
 .settlement-title{font-weight:700;font-size:13.5px;color:var(--secondary-dark);margin-bottom:8px;}
 .settlement-line{font-size:13px;color:var(--ink);padding:4px 0;line-height:1.5;}
 .settlement-summary-line{border-top:1px dashed var(--border);margin-top:6px;padding-top:8px;color:var(--ink-secondary);}
 .fx-thb{color:var(--ink-secondary);font-weight:600;font-size:12px;}
 .fx-note{font-size:10.5px;color:var(--ink-secondary);font-style:italic;}
 .report-day-row{
 display:flex;justify-content:space-between;
 font-size:13.5px;padding:6px 0;color:var(--ink);
 }
 .notes-card ul{margin:0;padding-left:20px;}
 .notes-card li{margin-bottom:8px;font-size:13px;line-height:1.6;color:var(--ink);}
 .notes-card li:last-child{margin-bottom:0;}

 .map-card{overflow:hidden;padding-bottom:16px;}
 .leaflet-wrap{padding:0 16px;}
 #leafletMap{ height:320px; width:100%; border-radius:16px; }
 .lf-pin{
 width:28px;height:28px;border-radius:50% 50% 50% 0;
 background:var(--primary);
 transform:rotate(-45deg);
 box-shadow:0 3px 8px rgba(0,0,0,0.3);
 display:flex;align-items:center;justify-content:center;
 border:2px solid #fff;
 }
 .lf-pin span{
 transform:rotate(45deg);
 color:#fff;font-weight:700;font-size:12px;
 font-family:'Inter','Noto Sans Thai',-apple-system,'Segoe UI',sans-serif;
 }
 .map-actions{
 display:flex;flex-wrap:wrap;gap:8px;
 padding:14px 22px 4px;
 }

 .route-visual{padding:18px 22px 6px;display:flex;flex-direction:column;}
 .rv-stop{display:flex;gap:12px;align-items:flex-start;position:relative;}
 .rv-stop .rv-num{
 flex:0 0 auto;
 width:28px;height:28px;border-radius:50%;
 background:var(--primary);color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-weight:700;font-size:12.5px;
 z-index:1;
 }
 .rv-stop .rv-line{
 position:absolute;left:13px;top:28px;bottom:-14px;width:2px;
 background:repeating-linear-gradient(to bottom, var(--secondary) 0 4px, transparent 4px 8px);
 }
 .rv-stop:last-child .rv-line{display:none;}
 .rv-stop-body{padding:2px 0 22px;flex:1;}
 .rv-stop-name{font-weight:700;font-size:13.5px;color:var(--ink);}
 .chip-link{
 text-decoration:none;
 font-size:12px;font-weight:600;
 background:var(--secondary-soft);color:var(--secondary-dark);
 padding:6px 12px;border-radius:20px;
 display:inline-flex;align-items:center;gap:5px;
 transition:transform .12s ease;
 }
 .chip-link:hover{transform:translateY(-1px);}
 .chip-link.full{background:var(--primary-soft);color:var(--primary-dark);font-weight:700;}

 /* ---------- Floating quick-actions menu ---------- */
 .fab-backdrop{
 position:fixed;inset:0;
 background:rgba(34,34,34,0.28);
 z-index:1600;
 opacity:0;pointer-events:none;
 transition:opacity .2s ease;
 }
 .fab-backdrop.show{opacity:1;pointer-events:auto;}

 .fab-wrap{
 position:fixed;
 right:max(20px, env(safe-area-inset-right));
 bottom:max(20px, env(safe-area-inset-bottom));
 z-index:1700;
 display:flex;flex-direction:column;align-items:flex-end;gap:14px;
 }
 .fab-menu{display:flex;flex-direction:column;align-items:flex-end;gap:12px;}
 .fab-item{
 display:flex;align-items:center;gap:12px;
 text-decoration:none;font-family:inherit;
 background:none;border:none;padding:0;cursor:pointer;
 opacity:0;transform:translateY(10px) scale(0.92);
 pointer-events:none;
 transition:opacity .18s ease, transform .22s cubic-bezier(0.2,0,0,1);
 }
 .fab-wrap.open .fab-item{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
 .fab-wrap.open .fab-item:nth-child(1){transition-delay:.12s;}
 .fab-wrap.open .fab-item:nth-child(2){transition-delay:.08s;}
 .fab-wrap.open .fab-item:nth-child(3){transition-delay:.04s;}
 .fab-wrap.open .fab-item:nth-child(4){transition-delay:0s;}
 .fab-item-label{
 background:var(--ink);color:#fff;
 font-size:13px;font-weight:600;white-space:nowrap;
 padding:8px 14px;border-radius:20px;
 box-shadow:var(--shadow);
 }
 .fab-item-icon{
 flex:0 0 auto;
 width:48px;height:48px;border-radius:50%;
 background:var(--surface);color:var(--primary);
 display:flex;align-items:center;justify-content:center;
 box-shadow:var(--shadow);border:1px solid var(--border-light);
 transition:background var(--transition), transform var(--transition);
 }
 .fab-item-icon .mi{font-size:22px;}
 .fab-item:hover .fab-item-icon{background:var(--primary-soft);transform:scale(1.06);}
 .fab-item:hover .fab-item-label{background:var(--primary-dark);}

 .fab-toggle{
 position:relative;
 width:60px;height:60px;border-radius:50%;
 background:var(--primary);color:#fff;border:none;
 display:flex;align-items:center;justify-content:center;
 cursor:pointer;
 box-shadow:0 10px 24px rgba(255,56,92,0.38), var(--shadow);
 transition:background .2s ease, box-shadow .2s ease, transform .2s cubic-bezier(0.2,0,0,1);
 }
 .fab-toggle:hover{transform:scale(1.05);box-shadow:0 12px 28px rgba(255,56,92,0.46), var(--shadow-hover);}
 .fab-toggle:active{transform:scale(0.95);}
 .fab-wrap.open .fab-toggle{background:var(--ink);}
 .fab-toggle .mi{
 position:absolute;font-size:26px;
 transition:opacity .2s ease, transform .25s cubic-bezier(0.2,0,0,1);
 }
 .fab-icon-menu{opacity:1;transform:rotate(0deg) scale(1);}
 .fab-icon-close{opacity:0;transform:rotate(-90deg) scale(0.5);}
 .fab-wrap.open .fab-icon-menu{opacity:0;transform:rotate(90deg) scale(0.5);}
 .fab-wrap.open .fab-icon-close{opacity:1;transform:rotate(0deg) scale(1);}

 @media (max-width:640px){
 .fab-wrap{right:16px;bottom:16px;gap:12px;}
 .fab-toggle{width:54px;height:54px;}
 .fab-toggle .mi{font-size:24px;}
 .fab-item-icon{width:44px;height:44px;}
 .fab-item-label{font-size:12.5px;padding:7px 12px;}
 }

 footer{
 margin-top:44px;text-align:center;
 font-size:11.5px;letter-spacing:0.06em;
 color:var(--ink-secondary);font-weight:700;
 padding-top:20px;border-top:1px solid var(--border-light);
 }

 @media (prefers-reduced-motion: reduce){
 *, *::before, *::after{
 animation-duration:0.01ms !important;
 animation-iteration-count:1 !important;
 transition-duration:0.01ms !important;
 scroll-behavior:auto !important;
 }
 }

 /* ---------- Day rail: horizontal scroll on anything narrower than wide desktop ---------- */
 @media (max-width:900px){
 .day-rail{
 display:grid;
 grid-template-columns:repeat(5, 1fr);
 }
 .day-pill{padding:8px 5px;text-align:center;}
 .day-pill .pill-top{justify-content:center;margin-bottom:4px;}
 .day-pill .route{display:none;}
 .day-pill .num{height:20px;padding:0 8px;font-size:9.5px;}
 .pill-date-row{margin-bottom:2px;}
 .pill-date-main{display:block;font-size:12px;line-height:1.35;overflow-wrap:break-word;word-break:break-word;}
 .pill-date-weekday{display:block;font-size:9.5px;margin-left:0;margin-top:2px;}

 /* Sticky bar: only the selected day keeps its full detail once compacted */
 .day-rail.is-stuck .day-pill{padding:9px 6px;}
 .day-rail.is-stuck .day-pill .pill-top{margin-bottom:0;}
 .day-rail.is-stuck .day-pill:not(.active) .pill-date-weekday{display:none;margin:0;}
 .day-rail.is-stuck .day-pill .pill-date-main{font-size:11px;}
 }

function formatDurationOnly(timeStr){
 const parts = timeStr.split('–');
 if (parts.length !== 2) return '';
 const toMinutes = t => {
 const hm = t.trim().split(':').map(Number);
 return hm[0] * 60 + hm[1];
 };
 let start = toMinutes(parts[0]);
 let end = toMinutes(parts[1]);
 if (end < start) end += 24 * 60;
 const diff = end - start;
 let durText;
 if (diff >= 60){
 const h = Math.floor(diff / 60);
 const m = diff % 60;
 durText = h + '.' + String(m).padStart(2,'0') + ' hrs';
 } else {
 durText = diff + ' min';
 }
 return '<span class="tl-dur">(' + durText + ')</span>';
}

const tripWeather = {}; // date string -> { max, min, code, isForecast }

async function loadTripWeather(){
 const msPerDay = 24 * 60 * 60 * 1000;
 const today = new Date(); today.setHours(0, 0, 0, 0);
 const dates = tripData.map(d => d.date);
 const startDate = dates[0];
 const endDate = dates[dates.length - 1];
 const daysUntilEnd = Math.round((new Date(endDate + 'T00:00:00') - today) / msPerDay);

 try {
 if (daysUntilEnd >= -1 && daysUntilEnd <= 16){
 // Within Open-Meteo's live forecast window — use the real forecast.
 const url = `https://api.open-meteo.com/v1/forecast?latitude=${TAIPEI_LAT}&longitude=${TAIPEI_LON}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTaipei&start_date=${startDate}&end_date=${endDate}`;
 const res = await fetch(url);
 const data = await res.json();
 if (data && data.daily && data.daily.time){
 data.daily.time.forEach((date, i) => {
 tripWeather[date] = {
 max: data.daily.temperature_2m_max[i],
 min: data.daily.temperature_2m_min[i],
 code: data.daily.weathercode[i],
 isForecast: true,
 };
 });
 }
 } else {
 // Trip is too far out for a live forecast — average the same calendar dates
 // from the past 3 complete years as a "typical weather" estimate instead.
 const thisYear = today.getFullYear();
 const perDateSamples = {};
 for (const year of [thisYear - 1, thisYear - 2, thisYear - 3]){
 const yStart = String(year) + startDate.slice(4);
 const yEnd = String(year) + endDate.slice(4);
 try {
 const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${TAIPEI_LAT}&longitude=${TAIPEI_LON}&start_date=${yStart}&end_date=${yEnd}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTaipei`;
 const res = await fetch(url);
 const data = await res.json();
 if (data && data.daily && data.daily.time){
 data.daily.time.forEach((date, i) => {
 const mmdd = date.slice(5);
 if (!perDateSamples[mmdd]) perDateSamples[mmdd] = [];
 perDateSamples[mmdd].push({
 max: data.daily.temperature_2m_max[i],
 min: data.daily.temperature_2m_min[i],
 code: data.daily.weathercode[i],
 });
 });
 }
 } catch (e) { console.error('historical weather fetch failed for', year, e); }
 }
 const avg = arr => arr.reduce((s, v) => s + v, 0) / arr.length;
 dates.forEach(date => {
 const samples = perDateSamples[date.slice(5)];
 if (!samples || !samples.length) return;
 const codeCounts = {};
 samples.forEach(s => { codeCounts[s.code] = (codeCounts[s.code] || 0) + 1; });
 const modeCode = Number(Object.keys(codeCounts).sort((a, b) => codeCounts[b] - codeCounts[a])[0]);
 tripWeather[date] = {
 max: Math.round(avg(samples.map(s => s.max))),
 min: Math.round(avg(samples.map(s => s.min))),
 code: modeCode,
 isForecast: false,
 };
 });
 }
 } catch (e) {
 console.error('weather fetch failed', e);
 }
 renderWeatherChip(tripData[activeIndex]);
}

const PEOPLE = ['AM', 'For', 'Arm'];

let cachedTwdToThbRate = null;
let rateFetchedAt = 0;
let rateFetchPromise = null;
const RATE_REFRESH_MS = 10 * 60 * 1000; // keep the rate reasonably "live" for long sessions
const FALLBACK_TWD_TO_THB_RATE = 1.05; // used only when the live rate can't be fetched

function getTwdToThbRate(){
 const isStale = cachedTwdToThbRate === null || (Date.now() - rateFetchedAt) > RATE_REFRESH_MS;
 if (!isStale) return Promise.resolve(cachedTwdToThbRate);
 if (rateFetchPromise) return rateFetchPromise; // a fetch is already in flight — share it
 rateFetchPromise = fetch('https://api.frankfurter.app/latest?from=TWD&to=THB')
 .then(res => res.json())
 .then(data => {
 if (data && data.rates && typeof data.rates.THB === 'number'){
 cachedTwdToThbRate = data.rates.THB;
 rateFetchedAt = Date.now();
 }
 return cachedTwdToThbRate;
 })
 .catch(e => {
 console.error('exchange rate fetch failed', e);
 return cachedTwdToThbRate;
 })
 .finally(() => { rateFetchPromise = null; });
 return rateFetchPromise;
}
let reportActiveDay = 1;

function expenseKey(dayNumber){ return `expenses_day_${dayNumber}`; }

// Fallback used only when window.storage isn't available in this rendering context.
// In that case data still works perfectly within this open tab, but won't be
// saved once the page is closed/reloaded, and won't sync to other people's devices.
const memoryStore = {};
let usingStorageFallback = false;

async function loadDayExpenses(dayNumber){
 const key = expenseKey(dayNumber);
 try {
 if (!window.storage || typeof window.storage.get !== 'function') throw new Error('storage unavailable');
 const res = await window.storage.get(key, true);
 if (!usingStorageFallback && memoryStore[key] !== undefined) {
 // We previously fell back for this key; keep using the fallback copy so we don't
 // silently lose data that only exists in memory.
 return JSON.parse(memoryStore[key]);
 }
 return res && res.value ? JSON.parse(res.value) : [];
 } catch (e) {
 usingStorageFallback = true;
 return memoryStore[key] ? JSON.parse(memoryStore[key]) : [];
 }
}

async function saveDayExpenses(dayNumber, list){
 const key = expenseKey(dayNumber);
 memoryStore[key] = JSON.stringify(list); // always keep an in-memory copy as a safety net
 try {
 if (!window.storage || typeof window.storage.set !== 'function') throw new Error('storage unavailable');
 const result = await window.storage.set(key, JSON.stringify(list), true);
 if (!result) throw new Error('Storage write returned no result');
 return result;
 } catch (e) {
 usingStorageFallback = true;
 return { key, value: memoryStore[key], shared: false };
 }
}

 let pendingDelete = null; // { item, index, timer }
 const undoToast = document.getElementById('undoToast');
 const undoToastText = document.getElementById('undoToastText');
 const undoBtn = document.getElementById('undoBtn');

 function hideUndoToast(){

 bar.style.animation = 'none';
 void bar.offsetHeight; // force reflow so the shrink animation restarts every time
 bar.style.animation = '';
 undoToast.style.display = 'flex';
 }

 function commitPendingDelete(){
 if (!pendingDelete) return;
 pendingDelete = null;
 hideUndoToast();
 persist();
 }

 function scheduleDelete(idx){
 if (pendingDelete) commitPendingDelete(); // commit any earlier pending delete first
 const item = list[idx];
 list.splice(idx, 1);
 refreshListUI();
 pendingDelete = { item, index: idx };
 showUndoToast(item);
 pendingDelete.timer = setTimeout(commitPendingDelete, 3000);
 }

 undoBtn.addEventListener('click', () => {
 if (!pendingDelete) return;
 clearTimeout(pendingDelete.timer);
 list.splice(pendingDelete.index, 0, pendingDelete.item);
 pendingDelete = null;
 hideUndoToast();
 refreshListUI();
 });

async function renderReportSummary(){
 const section = document.getElementById('reportSummarySection');
 let allLists;
 try {
 allLists = await Promise.all(tripData.map(d => loadDayExpenses(d.dayNumber)));
 } catch (err) {
 section.innerHTML = `<div class="expense-error"><span class="mi mi-sm">error</span> Load failed: ${err.message || err}</div>`;
 return;
 }
 const dayTotals = allLists.map(list => list.reduce((s, e) => s + Number(e.amount || 0), 0));
 const grandTotal = dayTotals.reduce((s, t) => s + t, 0);
 const perPersonShare = grandTotal / PEOPLE.length;

 const paidByPerson = {};
 PEOPLE.forEach(p => paidByPerson[p] = 0);
 allLists.flat().forEach(e => {
 if (paidByPerson[e.name] === undefined) paidByPerson[e.name] = 0;
 paidByPerson[e.name] += Number(e.amount || 0);
 });
 const maxPaid = Math.max(perPersonShare, ...Object.values(paidByPerson), 1);

 const rate = await getTwdToThbRate();
 const toTHB = ntd => rate ? Math.round(ntd * rate).toLocaleString() : null;
 const grandTHB = toTHB(grandTotal);

 // ---- Hero stat: grand total ----
 let html = `
 <div class="stat-hero">
 <div class="stat-hero-label">Total spent</div>
 <div class="stat-hero-value">${grandTotal.toLocaleString()} NT$</div>
 <div class="stat-hero-sub">${grandTHB ? `≈ ${grandTHB} บาท` : 'Exchange rate unavailable'}</div>
 <div class="stat-hero-split"><span>Split ${PEOPLE.length} ways</span><b>${perPersonShare.toLocaleString(undefined,{maximumFractionDigits:0})} NT$ each</b></div>
 </div>
 `;

 // ---- Per-person stat tiles ----
 html += `<div class="stat-section-label">By Person</div>`;
 html += `<div class="stat-grid">` + Object.keys(paidByPerson).map(name => {
 const paid = paidByPerson[name];
 const diff = paid - perPersonShare;
 const barPct = Math.min(100, (paid / maxPaid) * 100);
 const isGet = diff >= 0;
 return `
 <div class="stat-tile">
 <div class="stat-tile-head">
 <div class="stat-tile-avatar">${name.slice(0,1).toUpperCase()}</div>
 <div class="stat-tile-name">${name}</div>
 </div>
 <div class="stat-tile-value ${isGet ? 'is-get' : 'is-owe'}">${isGet ? '+' : '−'}${Math.abs(diff).toLocaleString(undefined,{maximumFractionDigits:0})}</div>
 <div class="stat-tile-paid">${isGet ? 'gets back' : 'owes'} · paid ${paid.toLocaleString()} NT$</div>
 <div class="stat-tile-bar-track"><div class="stat-tile-bar ${isGet ? 'bar-get' : 'bar-owe'}" style="width:${barPct}%"></div></div>
 </div>
 `;
 }).join('') + `</div>`;

 // ---- Per-day breakdown, including who paid what within that day ----
 html += `<div class="stat-section-label">Daily Breakdown</div>`;
 html += `<div class="report-daybreakdown">`;
 html += tripData.map((d, i) => {
 const byPersonThisDay = {};
 allLists[i].forEach(e => { byPersonThisDay[e.name] = (byPersonThisDay[e.name] || 0) + Number(e.amount || 0); });
 const personLine = Object.keys(byPersonThisDay).length
 ? Object.keys(byPersonThisDay).map(n => `${n} จ่าย ${byPersonThisDay[n].toLocaleString()}`).join(' · ')
 : 'ยังไม่มีรายการ';
 return `
 <div class="report-day-row">
 <span>Day ${d.dayNumber} <span class="report-day-date">${d.dateLabel}</span></span>
 <span>${dayTotals[i].toLocaleString()} NT$</span>
 </div>
 <div class="report-day-subline">${personLine}</div>
 `;
 }).join('');
 html += `</div>`;

 // ---- Settlement statement: minimal transfers so everyone ends up even ----
 const balances = PEOPLE.map(name => ({ name, diff: paidByPerson[name] - perPersonShare }));
 const creditors = balances.filter(b => b.diff > 0.5).sort((a,b) => b.diff - a.diff).map(b => ({...b}));
 const debtors = balances.filter(b => b.diff < -0.5).sort((a,b) => a.diff - b.diff).map(b => ({...b}));
 const transfers = [];
 let ci = 0, di = 0;
 while (ci < creditors.length && di < debtors.length){
 const amt = Math.min(creditors[ci].diff, -debtors[di].diff);
 if (amt > 0.5) transfers.push({ from: debtors[di].name, to: creditors[ci].name, amt });
 creditors[ci].diff -= amt;
 debtors[di].diff += amt;
 if (creditors[ci].diff < 0.5) ci++;
 if (debtors[di].diff > -0.5) di++;
 }

 const rateNote = rate
 ? `<span class="fx-note">(1 NT$ ≈ ${rate.toFixed(2)} บาท)</span>`
 : `<span class="fx-note">(ดึงอัตราแลกเปลี่ยนไม่สำเร็จ)</span>`;

 html += `<div class="settlement-box">`;
 html += `<div class="settlement-title"><span class="mi mi-sm">receipt_long</span> Settlement</div>`;
 if (!transfers.length){
 html += `<div class="settlement-line">ยอดเท่ากันพอดีทุกคนแล้ว ไม่ต้องโอนเพิ่มค่ะ</div>`;
 } else {
 transfers.forEach(t => {
 const thb = toTHB(t.amt);
 html += `<div class="settlement-line"><span class="mi mi-sm">payments</span> <b>${t.from}</b> ต้องจ่ายให้ <b>${t.to}</b> <b>${Math.round(t.amt).toLocaleString()} NT$</b>${thb ? ` <span class="fx-thb">(≈ ${thb} บาท)</span>` : ''}</div>`;
 });
 }
 html += `<div class="settlement-line settlement-summary-line">รวมทั้งทริปใช้ไป <b>${grandTotal.toLocaleString()} NT$</b>${grandTHB ? ` <span class="fx-thb">(≈ ${grandTHB} บาท)</span>` : ''} เฉลี่ยคนละ <b>${perPersonShare.toLocaleString(undefined,{maximumFractionDigits:0})} NT$</b></div>`;
 html += `<div class="settlement-line fx-note">${rateNote}</div>`;
 html += `</div>`;

 section.innerHTML = html;
}

document.getElementById('exportExcelBtn').addEventListener('click', async () => {
 let allLists;
 try {
 allLists = await Promise.all(tripData.map(d => loadDayExpenses(d.dayNumber)));
 } catch (err) {
 alert('Load failed: ' + (err.message || err));
 return;
 }

 const headerStyle = { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '3D8A90' } }, alignment: { horizontal: 'center' } };
 const titleStyle = { font: { bold: true, sz: 14 } };
 const sectionStyle = { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: 'C14732' } } };
 const bold = { font: { bold: true } };
 const money = n => Number(n) || 0;

 // ---------- Sheet 1: Transactions ----------
 const txHeader = ['Day', 'Date', 'Name', 'Item', 'Amount (NT$)', 'Payment Method'];
 const txRows = [];
 tripData.forEach((d, i) => {
 allLists[i].forEach(e => {
 txRows.push([`Day ${d.dayNumber}`, d.dateLabel, e.name, e.item, money(e.amount), e.payment]);
 });
 });
 const wsTx = XLSX.utils.aoa_to_sheet([txHeader, ...txRows]);
 wsTx['!cols'] = [{ wch: 8 }, { wch: 16 }, { wch: 10 }, { wch: 24 }, { wch: 14 }, { wch: 14 }];
 txHeader.forEach((_, c) => {
 const ref = XLSX.utils.encode_cell({ r: 0, c });
 if (wsTx[ref]) wsTx[ref].s = headerStyle;
 });
 txRows.forEach((_, r) => {
 const ref = XLSX.utils.encode_cell({ r: r + 1, c: 4 });
 if (wsTx[ref]) wsTx[ref].z = '#,##0';
 });

 // ---------- Sheet 2: Summary ----------
 const grandTotal = txRows.reduce((s, r) => s + r[4], 0);
 const perShare = grandTotal / PEOPLE.length;
 const paidByPerson = {};
 PEOPLE.forEach(p => paidByPerson[p] = 0);
 txRows.forEach(r => { paidByPerson[r[2]] = (paidByPerson[r[2]] || 0) + r[4]; });

 const aoa = [];
 const styleMap = {};
 const push = (row, styles) => {
 const r = aoa.length;
 aoa.push(row);
 if (styles) Object.keys(styles).forEach(c => { styleMap[`${r}:${c}`] = styles[c]; });
 };

 push(['Taiwan Trip — สรุปค่าใช้จ่ายทั้งทริป'], { 0: titleStyle });
 push(['']);
 push(['วันที่', 'ยอดรวม (NT$)'], { 0: headerStyle, 1: headerStyle });
 tripData.forEach((d, i) => {
 const total = allLists[i].reduce((s, e) => s + money(e.amount), 0);
 push([`Day ${d.dayNumber} ${d.dateLabel}`, total]);
 });
 push(['']);
 push(['รวมทั้งทริป', grandTotal], { 0: bold, 1: bold });
 push([`หาร ${PEOPLE.length} คน คนละ`, Math.round(perShare)]);
 push(['']);
 push(['สรุปรายคน', '', ''], { 0: sectionStyle, 1: sectionStyle, 2: sectionStyle });
 push(['Name', 'จ่ายไปแล้ว (NT$)', 'ผลลัพธ์'], { 0: headerStyle, 1: headerStyle, 2: headerStyle });
 PEOPLE.forEach(p => {
 const diff = paidByPerson[p] - perShare;
 push([p, Math.round(paidByPerson[p]), diff >= 0 ? `ได้คืน ${Math.round(diff).toLocaleString()} NT$` : `ต้องจ่ายเพิ่ม ${Math.round(Math.abs(diff)).toLocaleString()} NT$`]);
 });
 push(['']);

 // Settlement transfers (same greedy algorithm as the in-page report)
 const balances = PEOPLE.map(name => ({ name, diff: paidByPerson[name] - perShare }));
 const creditors = balances.filter(b => b.diff > 0.5).sort((a,b) => b.diff - a.diff).map(b => ({...b}));
 const debtors = balances.filter(b => b.diff < -0.5).sort((a,b) => a.diff - b.diff).map(b => ({...b}));
 const transfers = [];
 let ci = 0, di = 0;
 while (ci < creditors.length && di < debtors.length){
 const amt = Math.min(creditors[ci].diff, -debtors[di].diff);
 if (amt > 0.5) transfers.push([debtors[di].name, '→', creditors[ci].name, Math.round(amt)]);
 creditors[ci].diff -= amt; debtors[di].diff += amt;
 if (creditors[ci].diff < 0.5) ci++;
 if (debtors[di].diff > -0.5) di++;
 }
 push(['ใครต้องโอนให้ใคร', '', '', ''], { 0: sectionStyle, 1: sectionStyle, 2: sectionStyle, 3: sectionStyle });
 if (!transfers.length){
 push(['ยอดเท่ากันพอดีทุกคนแล้ว']);
 } else {
 transfers.forEach(t => push(t));
 }

 const wsSummary = XLSX.utils.aoa_to_sheet(aoa);
 wsSummary['!cols'] = [{ wch: 26 }, { wch: 16 }, { wch: 20 }, { wch: 10 }];
 wsSummary['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 3 } }];
 Object.keys(styleMap).forEach(key => {
 const [r, c] = key.split(':').map(Number);
 const ref = XLSX.utils.encode_cell({ r, c });
 if (!wsSummary[ref]) wsSummary[ref] = { t: 's', v: '' };
 wsSummary[ref].s = styleMap[key];
 });

 const wb = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
 XLSX.utils.book_append_sheet(wb, wsTx, 'Transactions');
 XLSX.writeFile(wb, 'taiwan-trip-expenses.xlsx');
});

// Leaflet measures its container on init; if that happens before web fonts finish
// loading (which can reflow card heights) or before the page has fully laid out,
// the map is left showing a grey placeholder with tiles positioned for the wrong
// size. Re-measuring after load and once fonts settle fixes that.
try {
 const refreshMapSize = () => { if (leafletMap) leafletMap.invalidateSize(); };
 window.addEventListener('load', () => setTimeout(refreshMapSize, 200));
 if (document.fonts && document.fonts.ready){
 document.fonts.ready.then(() => setTimeout(refreshMapSize, 100));
 }
} catch (e) { console.error('map invalidateSize wiring failed', e); }

// Spotlight hover: track the cursor position on the two main cards (desktop only)
try {
 if (window.matchMedia('(hover: hover)').matches){
 document.querySelectorAll('.timeline-card, .map-card').forEach(card => {
 card.addEventListener('mousemove', (ev) => {
 const rect = card.getBoundingClientRect();
 card.style.setProperty('--spot-x', ((ev.clientX - rect.left) / rect.width * 100) + '%');
 card.style.setProperty('--spot-y', ((ev.clientY - rect.top) / rect.height * 100) + '%');
 });
 });
 }
} catch (e) { console.error('spotlight hover wiring failed', e); }

try {
 const dayRailEl = document.getElementById('dayRail');
 const heroEl = document.querySelector('header.hero');
 let stickyThreshold = 100;
 function recalcStickyThreshold(){
 stickyThreshold = heroEl ? heroEl.offsetHeight * 0.5 : 100;
 }
 recalcStickyThreshold();
 window.addEventListener('resize', recalcStickyThreshold, { passive: true });

 let dayRailTicking = false;
 window.addEventListener('scroll', () => {
 if (dayRailTicking) return;
 dayRailTicking = true;
 requestAnimationFrame(() => {
 dayRailEl.classList.toggle('is-stuck', window.scrollY > stickyThreshold);
 dayRailTicking = false;
 });
 }, { passive: true });
} catch (e) { console.error('sticky day-rail scroll listener failed', e); }
